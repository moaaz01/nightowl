[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightowl-security"
dynamic = ["version"]
description = "NightOwl - Unified Android Security Analysis Platform: validated secrets, auth mapping, subscription enforcement, packer fingerprinting, privacy audit, SCA/SBOM, dynamic lab, MCP agent bridge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "moaaz01" }]
requires-python = ">=3.12"
keywords = [
    "android", "apk", "security", "pentesting", "frida", "mobsec",
    "masvs", "mastg", "secrets-detection", "sbom", "mcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0",
    "loguru>=0.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
full = [
    "androguard>=3.4",
    "requests>=2.28",
]
agent = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
nightowl = "nightowl_pkg.cli:main"

[project.urls]
Homepage = "https://github.com/moaaz01/nightowl"
Repository = "https://github.com/moaaz01/nightowl"
Issues = "https://github.com/moaaz01/nightowl/issues"

[tool.setuptools]
packages = ["nightowl_pkg"]

[tool.setuptools.dynamic]
version = { attr = "nightowl_pkg.__version__" }

[tool.setuptools.package-data]
nightowl_pkg = [
    "dragonjar_data/**/*.json",
    "dragonjar_data/**/*.yaml",
    "dragonjar_data/**/*.yml",
    "dragonjar_data/**/*.sh",
    "dragonjar_data/**/*.py",
    "dragonjar_data/.semgrepignore",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "workspace", "targets", "tools"]

[tool.ruff.lint]
# Blocking set: syntax errors and undefined names only for now; broaden
# incrementally once the legacy engine is fully modernized.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
