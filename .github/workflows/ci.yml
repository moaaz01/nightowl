name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]" pytest
      - name: Run test suite
        run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Blocking set lives in pyproject ([tool.ruff.lint] select).
      # Broaden incrementally; do not weaken without discussion.
      - run: ruff check .

  self-scan:
    name: semgrep (self-scan)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory until baseline is triaged, then flip
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan NightOwl with its own medicine
        run: semgrep scan --config p/ci --severity ERROR --error || true

  smoke-cli:
    name: CLI smoke (pip install -> scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and verify entry point
        run: |
          pip install -e ".[full]"
          nightowl version
          NIGHTOWL_HOME=${{ runner.temp }}/nwhome nightowl preflight || true
